<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1217">
<title>CRM · VMU Wash&amp;Wheel</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMwYjBkMTEiLz48cGF0aCBkPSJNMTAgMThoMTBsMTIgMjYgMTItMjZoMTBMMzcgNTBIMjd6IiBmaWxsPSIjZTgyNjJlIi8+PGNpcmNsZSBjeD0iNTAiIGN5PSIxNCIgcj0iNCIgZmlsbD0iI2ZmYjgxYyIvPjwvc3ZnPgo=">
<style>:root{
  --bg:#f3f5f8; --card:#fff; --text:#161b24; --muted:#6b7585; --line:#e3e7ee; --side:#0f1217; --side-text:#c9d0dc;
  --red:#e8262e; --red-d:#c81d25; --amber:#f5a300; --ok:#16a870; --blue:#2f7df6; --grey:#8a93a3;
  --new:#e8262e; --confirmed:#2f7df6; --in_progress:#f5a300; --done:#16a870; --cancelled:#8a93a3; --no_show:#8a5cf6;
  --shadow:0 1px 2px rgba(15,18,23,.06),0 8px 24px -12px rgba(15,18,23,.16); --r:14px;
}
@media (prefers-color-scheme:dark){:root{--bg:#0b0d11;--card:#14181f;--text:#eef1f6;--muted:#9099a8;--line:#242a35;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6)}}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.muted{color:var(--muted)}

.logo{display:flex;align-items:center;gap:10px}
.logo span{background:var(--red);color:#fff;font-weight:900;padding:.2em .55em;border-radius:7px;transform:skewX(-8deg);letter-spacing:.04em}
.logo b{letter-spacing:.14em;font-size:.85rem;color:inherit}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4em;padding:.6em 1.1em;border-radius:10px;font-weight:600;border:1px solid var(--line);background:var(--card);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--grey)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-d)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.amber{background:var(--amber);border-color:var(--amber);color:#201600}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.sm{padding:.4em .8em;font-size:.88rem;border-radius:8px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{color:var(--side-text);text-decoration:underline;font-size:.9rem}

/* вхід */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--side)}
.login-card{width:min(380px,100%);background:#171c24;border:1px solid #2a313d;border-radius:20px;padding:32px;display:grid;gap:14px;color:#eef1f6;text-align:center}
.login-card .logo{justify-content:center;font-size:1.3rem}
.login-card p{color:#9aa3b2}
.login-card input{padding:14px 16px;border-radius:12px;border:1.5px solid #2f3744;background:#0f1217;outline:0;color:#fff}
.login-card input:focus{border-color:var(--amber)}
.login-err{color:#ff8a90;min-height:1.4em;font-size:.9rem}

/* каркас */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--side);color:var(--side-text);padding:22px 14px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh}
.side .logo{padding:0 8px;color:#fff;font-size:1.15rem}
.side nav{display:grid;gap:4px}
.side nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:inherit;font-weight:600;text-align:left;position:relative;transition:.15s}
.side nav button i{font-style:normal;width:22px;text-align:center}
.side nav button:hover{background:#1b212b}
.side nav button.on{background:var(--red);color:#fff}
.side nav em{margin-left:auto;background:#fff;color:var(--red);font-style:normal;font-weight:800;font-size:.78rem;border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px;animation:ping 1.6s infinite}
.side nav .on em{background:#fff}
@keyframes ping{50%{transform:scale(1.15)}}
.side-foot{margin-top:auto;display:grid;gap:10px;font-size:.88rem;padding:0 8px}
.side-foot a{color:var(--side-text)}
.sound{display:flex;gap:8px;align-items:center;cursor:pointer}
.main{padding:24px clamp(14px,3vw,36px) 40px;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.top h1{font-size:1.6rem;letter-spacing:-.01em}
.top-actions{display:flex;align-items:center;gap:14px}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(22,168,112,.6);animation:pulse 2s infinite}
.live-dot.off{background:var(--red);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(22,168,112,0)}100%{box-shadow:0 0 0 0 rgba(22,168,112,0)}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat small{color:var(--muted);display:block;font-size:.8rem}
.stat b{font-size:1.6rem;letter-spacing:-.02em}
.stat.alert{border-color:var(--red);background:color-mix(in srgb,var(--red) 8%,var(--card))}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.toolbar input,.toolbar select,.card input,.card select,dialog input,dialog select,dialog textarea{padding:.6em .85em;border-radius:10px;border:1px solid var(--line);background:var(--card);outline:0;min-width:0}
.toolbar input:focus,.toolbar select:focus,dialog input:focus,dialog select:focus,dialog textarea:focus,.card input:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent)}
.toolbar input[type=search]{flex:1;min-width:200px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto;max-width:100%}
.seg button{padding:.45em .85em;border-radius:7px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--text);color:var(--bg)}

/* список записів */
.list{display:grid;gap:10px}
.day-h{margin:14px 2px 2px;font-weight:700;color:var(--muted);text-transform:capitalize;display:flex;gap:10px;align-items:center}
.day-h::after{content:"";flex:1;height:1px;background:var(--line)}
.bk{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--st,var(--grey));border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s}
.bk:hover{transform:translateY(-1px);border-color:var(--grey);border-left-color:var(--st)}
.bk.fresh{animation:flash 2.4s}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--amber) 28%,var(--card))}}
.bk .tm{font-weight:800;font-size:1.25rem;letter-spacing:-.01em;line-height:1.1}
.bk .tm small{display:block;font-weight:500;color:var(--muted);font-size:.8rem;margin-top:3px}
.bk h3{font-size:1.05rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bk .car{color:var(--muted);font-weight:500}
.bk .svc{color:var(--muted);font-size:.9rem;margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bk .phone{display:inline-flex;align-items:center;gap:6px;font-weight:700;margin-top:6px;color:var(--blue)}
.bk .side-r{text-align:right;display:grid;gap:8px;justify-items:end}
.bk .sum{font-weight:800;font-size:1.1rem}
.pill{display:inline-block;padding:.15em .65em;border-radius:999px;font-size:.78rem;font-weight:700;background:color-mix(in srgb,var(--st,var(--grey)) 16%,transparent);color:var(--st,var(--grey));white-space:nowrap}
.src{font-size:.72rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 .4em}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
[data-st=new]{--st:var(--new)}[data-st=confirmed]{--st:var(--confirmed)}[data-st=in_progress]{--st:var(--in_progress)}
[data-st=done]{--st:var(--done)}[data-st=cancelled]{--st:var(--cancelled)}[data-st=no_show]{--st:var(--no_show)}
.empty{padding:40px 20px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}

/* дошка постів */
.board{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;overflow-x:auto;box-shadow:var(--shadow)}
.tl{position:relative;min-width:760px}
.tl-head,.tl-row{display:grid;grid-template-columns:70px 1fr}
.tl-hours{position:relative;height:26px;border-bottom:1px solid var(--line)}
.tl-hours span{position:absolute;transform:translateX(-50%);font-size:.78rem;color:var(--muted)}
.tl-row{align-items:stretch;margin-top:10px}
.tl-label{font-weight:800;display:flex;align-items:center;color:var(--muted)}
.tl-lane{position:relative;height:74px;background:repeating-linear-gradient(90deg,transparent 0 calc(var(--hw) - 1px),var(--line) calc(var(--hw) - 1px) var(--hw));border-radius:10px;background-color:color-mix(in srgb,var(--bg) 70%,var(--card))}
.tl-b{position:absolute;top:5px;bottom:5px;border-radius:8px;padding:5px 8px;overflow:hidden;font-size:.82rem;line-height:1.25;background:color-mix(in srgb,var(--st) 20%,var(--card));border:1.5px solid var(--st);cursor:pointer;transition:.15s}
.tl-b:hover{z-index:2;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.tl-b b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b span{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-now{position:absolute;top:26px;bottom:0;width:2px;background:var(--red);z-index:3;pointer-events:none}
.tl-now::before{content:"зараз";position:absolute;top:-2px;left:50%;transform:translate(-50%,-100%);font-size:.68rem;background:var(--red);color:#fff;padding:0 5px;border-radius:4px}
.tl-over{margin-top:10px;color:var(--red);font-weight:600}

/* клієнти / прайс */
.cl{display:grid;grid-template-columns:1fr auto;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;align-items:center}
.cl h3{font-size:1.02rem}
.cl .m{color:var(--muted);font-size:.88rem}
.cl .nums{display:flex;gap:18px;text-align:center}
.cl .nums b{display:block;font-size:1.15rem}.cl .nums small{color:var(--muted);font-size:.74rem}
.prices .grp{margin-bottom:22px}
.prices h3{margin:6px 2px 10px}
.pr-row{display:grid;grid-template-columns:minmax(160px,1.6fr) 90px repeat(auto-fit,minmax(70px,1fr));gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.pr-row.off{opacity:.55}
.pr-row input{width:100%;text-align:right;padding:.4em .5em}
.pr-row label{font-size:.7rem;color:var(--muted);display:block;text-align:right}
.pr-row .nm{font-weight:600}
.pr-row .nm small{display:block;color:var(--muted);font-weight:400}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;align-items:end}
.form-grid h3,.form-grid .full{grid-column:1/-1}
.form-grid label{display:grid;gap:5px;font-weight:600;font-size:.88rem}
.form-grid label small{font-weight:400;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips label{display:inline-flex;grid-template-columns:none;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:.35em .7em;font-weight:600;cursor:pointer}

/* модалка */
dialog{margin:auto;border:0;border-radius:20px;padding:0;width:min(640px,calc(100% - 24px));max-height:calc(100vh - 24px);background:var(--card);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.5);overflow:hidden}
dialog::backdrop{background:rgba(5,7,10,.6);backdrop-filter:blur(3px)}
.m-wrap{display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.m-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.m-head h2{font-size:1.25rem;line-height:1.2}
.m-x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);font-size:1.2rem;flex:none}
.m-body{padding:18px 22px;overflow:auto;display:grid;gap:16px}
.m-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 12px}
.kv dt{color:var(--muted)}.kv dd{font-weight:600}
.big-call{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:14px;background:var(--ok);color:#fff;font-weight:800;font-size:1.2rem}
.m-body label{display:grid;gap:5px;font-weight:600;font-size:.88rem}
.m-body .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.m-body .row3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}
.m-body textarea{min-height:78px;resize:vertical}
.svc-pick{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}
.svc-pick label{display:flex;grid-template-columns:none;gap:10px;align-items:center;font-weight:500;padding:6px;border-radius:6px;cursor:pointer}
.svc-pick label:hover{background:var(--bg)}
.svc-pick label span{flex:1}.svc-pick label em{font-style:normal;color:var(--muted);white-space:nowrap}
.svc-pick .cat{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:8px 6px 2px;font-weight:700}
.svc-pick input[type=number]{width:60px;padding:.2em .4em}
.slotpick{display:flex;flex-wrap:wrap;gap:6px}
.slotpick button{padding:.35em .7em;border-radius:8px;border:1px solid var(--line);font-weight:600;font-size:.88rem}
.slotpick button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.slotpick button:disabled{opacity:.35;text-decoration:line-through}
.warn{background:color-mix(in srgb,var(--amber) 18%,var(--card));border:1px solid var(--amber);border-radius:10px;padding:10px 12px;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.7em 1.2em;border-radius:999px;font-weight:600;z-index:200;box-shadow:var(--shadow)}
.toast.err{background:var(--red);color:#fff}

/* телефон / планшет */
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:auto 0 0;height:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:50;gap:0;border-top:1px solid #222a35}
  .side .logo,.side-foot{display:none}
  .side nav{display:flex;width:100%;gap:2px}
  .side nav button{flex:1;flex-direction:column;gap:2px;padding:7px 2px;font-size:.68rem;text-align:center;align-items:center}
  .side nav button i{font-size:1.2rem}
  .side nav em{position:absolute;top:2px;right:calc(50% - 26px);margin:0;min-width:18px;height:18px;font-size:.68rem}
  .main{padding-bottom:96px}
  .top h1{font-size:1.3rem}
}
@media (max-width:640px){
  .stats{display:flex;overflow-x:auto;gap:8px;margin-inline:-4px;padding:2px 4px 6px;scroll-snap-type:x proximity}
  .stat{flex:none;min-width:128px;padding:10px 12px;scroll-snap-align:start}
  .stat b{font-size:1.25rem}
  .stat small{font-size:.72rem}
  .toolbar select,.toolbar .btn{flex:none}
  .bk{grid-template-columns:1fr;gap:10px;padding:14px}
  .bk .tm{display:flex;align-items:baseline;gap:10px}
  .bk .tm small{margin:0}
  .bk .side-r{grid-template-columns:auto 1fr;justify-items:stretch;text-align:left;align-items:center}
  .bk .side-r .acts{justify-content:flex-end}
  .bk .phone{font-size:1.1rem;padding:6px 0}
  .kv{grid-template-columns:96px 1fr}
  .m-body .row2,.m-body .row3{grid-template-columns:1fr}
  .cl{grid-template-columns:1fr}
  .pr-row{grid-template-columns:1fr 1fr}
  .pr-row .nm{grid-column:1/-1}
  dialog{width:100%;max-height:100vh;border-radius:20px 20px 0 0;margin:auto 0 0}
  .m-wrap{max-height:92vh}
  .top-actions .btn{padding:.55em .9em}
}
@media print{.side,.top-actions,.toolbar,.acts{display:none!important}.app{display:block}}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <form id="loginForm" class="login-card">
    <div class="logo"><span>VMU</span><b>CRM</b></div>
    <p>Вхід для менеджерів мийки</p><p style="color:#ffb81c;font-size:.85rem">Демо: введіть будь-який пароль</p>
    <input id="pw" type="password" placeholder="Пароль" autocomplete="current-password" required autofocus>
    <button class="btn primary" type="submit">Увійти</button>
    <div class="login-err" id="loginErr" role="alert"></div>
  </form>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="logo"><span>VMU</span><b>CRM</b></div>
    <nav id="tabs">
      <button data-tab="today" class="on"><i>📋</i><span>Записи</span><em id="newBadge" hidden>0</em></button>
      <button data-tab="board"><i>🚗</i><span>Пости</span></button>
      <button data-tab="clients"><i>👥</i><span>Клієнти</span></button>
      <button data-tab="prices"><i>💰</i><span>Прайс</span></button>
      <button data-tab="settings"><i>⚙️</i><span>Налаштування</span></button>
    </nav>
    <div class="side-foot">
      <label class="sound"><input type="checkbox" id="soundOn"> <span>Звук нових записів</span></label>
      <a href="site.html" target="_blank" rel="noopener">Відкрити сайт ↗</a>
      <button id="logout" class="link">Вийти</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <h1 id="title">Записи</h1>
      <div class="top-actions">
        <span class="live-dot" id="liveDot" title="Оновлюється автоматично"></span>
        <button class="btn primary" id="addBtn">+ Новий запис</button>
      </div>
    </header>

    <!-- Записи -->
    <section data-view="today">
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <div class="seg" id="range">
          <button data-r="today" class="on">Сьогодні</button>
          <button data-r="tomorrow">Завтра</button>
          <button data-r="week">7 днів</button>
          <button data-r="upcoming">Майбутні</button>
          <button data-r="past">Минулі</button>
          <button data-r="all">Усі</button>
        </div>
        <select id="statusFilter" aria-label="Статус">
          <option value="">Усі статуси</option><option value="new">Нові</option><option value="confirmed">Підтверджені</option>
          <option value="in_progress">В роботі</option><option value="done">Виконані</option><option value="cancelled">Скасовані</option><option value="no_show">Не приїхали</option>
        </select>
        <input id="search" type="search" placeholder="Пошук: ім'я, телефон, авто, код" aria-label="Пошук">
        <a class="btn ghost" href="/crm/api/export.csv" download>⬇ CSV</a>
      </div>
      <div id="list" class="list"></div>
    </section>

    <!-- Пости -->
    <section data-view="board" hidden>
      <div class="toolbar">
        <button class="btn ghost" id="dPrev">‹</button>
        <input type="date" id="boardDate" aria-label="Дата">
        <button class="btn ghost" id="dNext">›</button>
        <button class="btn ghost" id="dToday">Сьогодні</button>
      </div>
      <div id="board" class="board"></div>
    </section>

    <!-- Клієнти -->
    <section data-view="clients" hidden>

    openBooking(S.bookings.find((b) => b.id === id));
  });
  $('#list').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList.contains('bk')) openBooking(S.bookings.find((b) => b.id === +e.target.dataset.id)); });
  $('#range').addEventListener('click', (e) => { const b = e.target.closest('[data-r]'); if (!b) return; S.range = b.dataset.r; $$('#range button').forEach((x) => x.classList.toggle('on', x === b)); loadList(); });
  $('#statusFilter').addEventListener('change', () => loadList());
  let st; $('#search').addEventListener('input', () => { clearTimeout(st); st = setTimeout(() => loadList(), 250); });
  $('#addBtn').addEventListener('click', () => openForm(null));

  // ---------- модалка запису: перегляд ----------
  const modal = $('#modal');
  modal.addEventListener('click', (e) => { if (e.target === modal) modal.close(); });
  function openBooking(b) {
    if (!b) return;
    modal.innerHTML = `<div class="m-wrap" data-st="${b.status}">
      <div class="m-head"><div><h2>${esc(b.name)}</h2><span class="pill">${STATUS[b.status]}</span> <span class="src">${esc(b.code)}</span></div><button class="m-x" data-close aria-label="Закрити">×</button></div>
      <div class="m-body">
        <a class="big-call" href="tel:${esc(b.phone)}">📞 ${esc(b.phone)}</a>
        <dl class="kv">
          <dt>Коли</dt><dd>${dlong(b.date)}, ${b.time}–${b.end} (${dur(b.duration)})</dd>
          <dt>Авто</dt><dd>${esc(b.car)} · клас ${esc(b.tier.toUpperCase())}</dd>
          <dt>Послуги</dt><dd>${b.services.map((s) => `${esc(s.name)}${s.qty > 1 ? ` ×${s.qty}` : ''} — ${s.from ? 'від ' : ''}${money(s.price)}${s.note ? ` <small class="muted">(${esc(s.note)})</small>` : ''}`).join('<br>')}</dd>
          <dt>Разом</dt><dd>${b.total_from ? 'від ' : ''}${money(b.total)}</dd>
          <dt>Створено</dt><dd>${esc(b.created_at)} UTC · ${b.source === 'site' ? 'із сайту' : 'менеджером'}</dd>
        </dl>
        <label>Нотатка менеджера<textarea id="mNote" placeholder="Коментар, домовленості з клієнтом…">${esc(b.manager_note)}</textarea></label>
        <label>Статус<select id="mStatus">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === b.status ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      </div>
      <div class="m-foot"><div class="acts"><button class="btn danger sm" data-del>Видалити</button><button class="btn sm" data-edit>Змінити запис</button></div><button class="btn primary" data-save>Зберегти</button></div></div>`;
    modal.showModal();
    modal.onclick = async (e) => {
      if (e.target === modal || e.target.closest('[data-close]')) return modal.close();
      if (e.target.closest('[data-edit]')) return openForm(b);
      if (e.target.closest('[data-del]')) { if (!confirm('Видалити запис остаточно? Краще змінити статус на «Скасовано».')) return; try { await api('/bookings/' + b.id, { method: 'DELETE' }); modal.close(); toast('Видалено'); refresh(); } catch (err) { toast(err.message, true); } return; }
      if (e.target.closest('[data-save]')) {
        try { await api('/bookings/' + b.id, { method: 'PATCH', body: { status: $('#mStatus').value, manager_note: $('#mNote').value } }); modal.close(); toast('Збережено'); refresh(); } catch (err) { toast(err.message, true); }
      }
    };
  }
  const refresh = () => { if (S.tab === 'today') loadList(true); else if (S.tab === 'board') loadBoard(true); else if (S.tab === 'clients') loadClients(); };

  // ---------- модалка запису: створення / редагування ----------
  async function ensureServices() {
    if (!S.services) { const r = await api('/services'); S.services = r.services; S.tiers = r.tiers; }
  }
  async function openForm(b) {
    await ensureServices();
    const st = S.settings;
    const f = { name: b?.name || '', phone: b?.phone || '', car: b?.car || '', tier: b?.tier || 'abc', date: b?.date || S.now.date, time: b?.time || '', status: b?.status || 'confirmed' };
    const cart = new Map((b?.services || []).map((s) => [s.id, s.qty || 1]));
    const catGroups = [...new Set(S.services.map((s) => s.category))];
    modal.innerHTML = `<form class="m-wrap" id="bf" novalidate>
      <div class="m-head"><h2>${b ? 'Змінити запис' : 'Новий запис'}</h2><button type="button" class="m-x" data-close aria-label="Закрити">×</button></div>
      <div class="m-body">
        <div class="row3"><label>Ім'я<input name="name" value="${esc(f.name)}" required maxlength="60"></label>
          <label>Телефон<input name="phone" value="${esc(f.phone)}" inputmode="tel" placeholder="+380…" required></label>
          <label>Марка авто<input name="car" value="${esc(f.car)}" required maxlength="40"></label></div>
        <label>Клас авто<select name="tier">${S.tiers.map((t) => `<option value="${t.id}" ${t.id === f.tier ? 'selected' : ''}>${esc(t.label)} — ${esc(t.title)}</option>`).join('')}</select></label>
        <div><b>Послуги</b><div class="svc-pick" id="svcPick"></div></div>
        <div class="row2"><label>Дата<input type="date" name="date" value="${f.date}" required></label>
          <label>Статус<select name="status">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${k === f.status ? 'selected' : ''}>${v}</option>`).join('')}</select></label></div>
        <div><b>Час</b> <span class="muted" id="durInfo"></span><div class="slotpick" id="slotPick"></div></div>
        <label class="force" hidden style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" name="force"> Поставити всупереч зайнятості постів / поза робочим часом</label>
        <div class="warn" id="formWarn" hidden></div>
      </div>
      <div class="m-foot"><button type="button" class="btn" data-close>Скасувати</button><button type="submit" class="btn primary">${b ? 'Зберегти' : 'Створити запис'}</button></div></form>`;
    const form = $('#bf'); let time = f.time;
    const tier = () => form.tier.value;
    const renderPick = () => {
      let html = '';
      for (const c of catGroups) {
        const list = S.services.filter((s) => s.category === c && s.active && s.prices[tier()]);
        if (!list.length) continue;
        html += `<div class="cat">${esc(c)}</div>` + list.map((s) => `<label><input type="checkbox" data-id="${s.id}" ${cart.has(s.id) ? 'checked' : ''}><span>${esc(s.name)}${s.description ? ` <small class="muted">${esc(s.description)}</small>` : ''}</span>${s.unit ? `<input type="number" min="1" max="20" value="${cart.get(s.id) || 1}" data-qty="${s.id}" ${cart.has(s.id) ? '' : 'disabled'}>` : ''}<em>${s.prices[tier()].from ? 'від ' : ''}${money(s.prices[tier()].price)}</em></label>`).join('');
      }
      $('#svcPick').innerHTML = html;
    };
    const duration = () => {
      let raw = 0; for (const [id, q] of cart) { const s = S.services.find((x) => x.id === id); if (s) raw += s.duration * (s.unit ? q : 1); }
      return raw ? Math.max(st.step, Math.ceil(raw / st.step) * st.step) : 0;
    };
    const loadSlots = async () => {
      const d = duration(); $('#durInfo').textContent = d ? `· ~${dur(d)}` : '· оберіть послуги';
      if (!d || !form.date.value) { $('#slotPick').innerHTML = ''; return; }
      try {
        const r = await api(`/slots?date=${form.date.value}&duration=${d}&ignore=${b?.id || 0}`);
        $('#slotPick').innerHTML = r.slots.map((s) => `<button type="button" data-t="${s.time}" class="${s.time === time ? 'on' : ''}" ${s.free ? '' : 'disabled'} title="вільно ${s.free} з ${r.posts}">${s.time}${s.free && s.free < r.posts ? ` <small>(${s.free})</small>` : ''}</button>`).join('') || '<span class="muted">День недоступний</span>';
        $('.force', form).hidden = false;
      } catch (e) { $('#slotPick').innerHTML = `<span class="muted">${esc(e.message)}</span>`; }
    };
    renderPick(); loadSlots();
    form.tier.addEventListener('change', () => { for (const id of [...cart.keys()]) if (!S.services.find((s) => s.id === id)?.prices[tier()]) cart.delete(id); renderPick(); loadSlots(); });
    form.date.addEventListener('change', () => { time = ''; loadSlots(); });
    $('#svcPick').addEventListener('change', (e) => {
      const id = e.target.dataset.id; const q = e.target.dataset.qty;
      if (id) { if (e.target.checked) cart.set(id, +($(`[data-qty="${id}"]`)?.value) || 1); else cart.delete(id); const n = $(`[data-qty="${id}"]`); if (n) n.disabled = !e.target.checked; }
      if (q) cart.set(q, Math.max(1, Math.min(20, +e.target.value || 1)));
      time = ''; loadSlots();
    });
    $('#slotPick').addEventListener('click', (e) => { const t = e.target.closest('[data-t]'); if (!t) return; time = t.dataset.t; $$('#slotPick button').forEach((x) => x.classList.toggle('on', x === t)); });
    form.onclick = (e) => { if (e.target.closest('[data-close]')) modal.close(); };
    form.onsubmit = async (e) => {
      e.preventDefault(); const warn = $('#formWarn'); warn.hidden = true;
      const body = { name: form.name.value, phone: form.phone.value, car: form.car.value, tier: tier(), date: form.date.value, time, status: form.status.value, services: [...cart].map(([id, qty]) => ({ id, qty })), force: form.force.checked };
      if (!time) { warn.textContent = 'Оберіть час'; warn.hidden = false; return; }
      try {
        if (b) {
          const { status, ...rest } = body;
          await api('/bookings/' + b.id, { method: 'PATCH', body: { ...rest, status } });
        } else await api('/bookings', { method: 'POST', body });
        modal.close(); toast(b ? 'Запис змінено' : 'Запис створено'); refresh();
      } catch (err) { warn.textContent = err.message; warn.hidden = false; }
    };
    modal.showModal();
  }

  // ---------- дошка постів ----------
  async function loadBoard() {
    $('#boardDate').value = S.boardDate;
    const r = await api('/board?date=' + S.boardDate);
    const s = r.settings; const open = hmToMin(s.open); const close = hmToMin(s.close); const span = close - open;
    const pct = (m) => ((m - open) / span) * 100;
    const hours = []; for (let m = Math.ceil(open / 60) * 60; m <= close; m += 60) hours.push(m);
    const occ = r.bookings.filter((b) => b.post > 0);
    const lanes = Array.from({ length: s.posts }, (_, i) => i + 1);
    const hw = (60 / span) * 100;
    let html = `<div class="tl" style="--hw:${hw}%"><div class="tl-head"><div></div><div class="tl-hours">${hours.map((m) => `<span style="left:${pct(m)}%">${minToHm(m)}</span>`).join('')}</div></div>`;
    for (const p of lanes) {
      html += `<div class="tl-row"><div class="tl-label">Пост ${p}</div><div class="tl-lane" style="--hw:calc(${hw}% )">` +
        occ.filter((b) => b.post === p).map((b) => `<div class="tl-b" data-id="${b.id}" data-st="${b.status}" style="left:${pct(b.start_min)}%;width:${(b.duration / span) * 100}%" title="${esc(b.name)} · ${esc(b.car)}"><b>${b.time} ${esc(b.name)}</b><span>${esc(b.car)} · ${b.services.map((x) => esc(x.name)).join(', ')}</span></div>`).join('') + '</div></div>';
    }
    if (r.date === S.now.date && S.now.min >= open && S.now.min <= close) html += `<div class="tl-now" style="left:calc(70px + (100% - 70px) * ${pct(S.now.min) / 100})"></div>`;
    html += '</div>';
    const noPost = r.bookings.filter((b) => b.post === 0);
    if (noPost.length) html += `<h3 style="margin:18px 0 8px">Не займають пост (${noPost.length})</h3><div class="list">${noPost.map(bookingCard).join('')}</div>`;
    if (!r.bookings.length) html += '<div class="empty" style="margin-top:14px">На цей день записів немає</div>';
    $('#board').innerHTML = html;
    S.boardBookings = r.bookings;
  }
  $('#board').addEventListener('click', (e) => {
    const t = e.target.closest('[data-id]'); if (!t) return;
    if (e.target.closest('[data-act]')) return;
    openBooking(S.boardBookings.find((b) => b.id === +t.dataset.id));
  });
  const setBoardDate = (d) => { S.boardDate = d; loadBoard(); };
  $('#dPrev').addEventListener('click', () => setBoardDate(addDays(S.boardDate, -1)));
  $('#dNext').addEventListener('click', () => setBoardDate(addDays(S.boardDate, 1)));
  $('#dToday').addEventListener('click', () => setBoardDate(S.now.date));
  $('#boardDate').addEventListener('change', (e) => e.target.value && setBoardDate(e.target.value));

  // ---------- клієнти ----------
  let clients = [];
  async function loadClients() { clients = (await api('/clients')).clients; renderClients(); }
  function renderClients() {
    const q = $('#clientSearch').value.trim().toLowerCase(); const qd = q.replace(/\D/g, '');
    const list = clients.filter((c) => !q || c.name.toLowerCase().includes(q) || c.car.toLowerCase().includes(q) || (qd.length >= 3 && c.phone.includes(qd)));
    $('#clients').innerHTML = list.map((c) => `<div class="cl"><div><h3>${esc(c.name)} <span class="muted">· ${esc(c.car)}</span></h3>
      <div class="m"><a class="phone" href="tel:${esc(c.phone)}" style="color:var(--blue);font-weight:700">📞 ${esc(c.phone)}</a> · останній візит/запис: ${c.last_date ? dlong(c.last_date) : '—'}${c.next_date ? ` · <b>наступний: ${dlong(c.next_date)}</b>` : ''}</div></div>
      <div class="nums"><div><b>${c.bookings}</b><small>записів</small></div><div><b>${c.visits || 0}</b><small>візитів</small></div><div><b>${money(c.spent)}</b><small>оплачено</small></div>${c.no_shows ? `<div><b>${c.no_shows}</b><small>не з'явився</small></div>` : ''}</div>
      <div class="acts" style="grid-column:1/-1"><button class="btn sm" data-hist="${esc(c.phone)}">Історія записів</button><button class="btn sm primary" data-new="${esc(c.phone)}">Записати знову</button></div></div>`).join('') || '<div class="empty">Клієнтів не знайдено</div>';
  }
  $('#clientSearch').addEventListener('input', renderClients);
  $('#clients').addEventListener('click', async (e) => {
    const h = e.target.closest('[data-hist]'); const n = e.target.closest('[data-new]');
    if (h) { S.range = 'all'; $$('#range button').forEach((x) => x.classList.toggle('on', x.dataset.r === 'all')); $('#search').value = h.dataset.hist.replace('+380', '0'); await switchTab('today'); }
    if (n) { const c = clients.find((x) => x.phone === n.dataset.new); await openForm(null); const f = $('#bf'); f.name.value = c.name; f.phone.value = c.phone; f.car.value = c.car; }
  });

  // ---------- прайс ----------
  async function loadPrices() { const r = await api('/services'); S.services = r.services; S.tiers = r.tiers; renderPrices(); }
  function renderPrices() {
    const q = $('#priceSearch').value.trim().toLowerCase();
    const cats = [...new Set(S.services.map((s) => s.category))];
    $('#prices').innerHTML = cats.map((c) => {
      const list = S.services.filter((s) => s.category === c && (!q || s.name.toLowerCase().includes(q)));
      if (!list.length) return '';
      return `<div class="grp"><h3>${esc(c)}</h3>${list.map((s) => `<div class="pr-row ${s.active ? '' : 'off'}" data-sid="${s.id}">
        <div class="nm">${esc(s.name)}${s.description ? `<small>${esc(s.description)}</small>` : ''}<label style="text-align:left;display:flex;gap:6px;align-items:center;margin-top:4px"><input type="checkbox" data-f="active" ${s.active ? 'checked' : ''} style="width:auto"> показувати на сайті</label></div>
        <div><label>тривалість, хв</label><input type="number" min="5" max="600" step="5" value="${s.duration}" data-f="duration"></div>
        ${S.tiers.filter((t) => s.prices[t.id]).map((t) => `<div><label>${esc(t.label)}${s.prices[t.id].from ? ' (від)' : ''}</label><input type="number" min="0" step="10" value="${s.prices[t.id].price}" data-f="price" data-tier="${t.id}"></div>`).join('')}
      </div>`).join('')}</div>`;
    }).join('');
  }
  $('#priceSearch').addEventListener('input', renderPrices);
  $('#prices').addEventListener('change', async (e) => {
    const row = e.target.closest('[data-sid]'); if (!row) return;
    const body = {}; const f = e.target.dataset.f;
    if (f === 'active') body.active = e.target.checked;
    if (f === 'duration') body.duration = +e.target.value;
    if (f === 'price') body.prices = { [e.target.dataset.tier]: +e.target.value };
    try { await api('/services/' + row.dataset.sid, { method: 'PATCH', body }); toast('Збережено'); const s = S.services.find((x) => x.id === row.dataset.sid); if (f === 'active') { s.active = body.active; row.classList.toggle('off', !s.active); } if (f === 'duration') s.duration = body.duration; if (f === 'price') s.prices[e.target.dataset.tier].price = body.prices[e.target.dataset.tier]; } catch (err) { toast(err.message, true); loadPrices(); }
  });

  // ---------- налаштування ----------
  function renderSettings() {
    const s = S.settings;
    $('#settingsForm').innerHTML = `<h3>Робота мийки та онлайн-запис</h3>
      <label>Кількість постів<input type="number" name="posts" min="1" max="20" value="${s.posts}"></label>
      <label>Початок роботи<input type="time" name="open" value="${s.open}"></label>
      <label>Кінець роботи<input type="time" name="close" value="${s.close}"></label>
      <label>Крок запису<select name="step">${[15, 20, 30, 60].map((v) => `<option ${v === s.step ? 'selected' : ''} value="${v}">${v} хв</option>`).join('')}</select></label>
      <label>Мінімум до початку, хв<input type="number" name="lead_minutes" min="0" max="1440" value="${s.lead_minutes}"><small>клієнт не зможе записатись ближче ніж за цей час</small></label>
      <label>Запис відкритий на, днів<input type="number" name="horizon_days" min="1" max="60" value="${s.horizon_days}"></label>
      <label>Телефон на сайті<input name="phone" value="${esc(s.phone)}" maxlength="30"></label>
      <div class="full"><b>Вихідні дні тижня</b><div class="chips" style="margin-top:6px">${[1, 2, 3, 4, 5, 6, 0].map((d) => `<label><input type="checkbox" name="off" value="${d}" ${s.days_off.includes(d) ? 'checked' : ''}> ${WD_S[d]}</label>`).join('')}</div></div>
      <label class="full">Закриті дати (YYYY-MM-DD, через кому) — свята, технічні роботи<input name="blocked" value="${esc(s.blocked_dates.join(', '))}" placeholder="2026-12-25, 2027-01-01"></label>
      <div class="full"><button class="btn primary" type="submit">Зберегти налаштування</button></div>`;
  }
  $('#settingsForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const f = e.target;
    const body = { posts: +f.posts.value, open: f.open.value, close: f.close.value, step: +f.step.value, lead_minutes: +f.lead_minutes.value, horizon_days: +f.horizon_days.value, phone: f.phone.value,
      days_off: $$('[name=off]:checked', f).map((x) => +x.value), blocked_dates: f.blocked.value.split(/[,\s]+/).filter(Boolean) };
    try { const r = await api('/settings', { method: 'PUT', body }); S.settings = r.settings; toast('Налаштування збережено'); } catch (err) { toast(err.message, true); }
  });
  $('#pwForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const f = e.target;
    try { await api('/password', { method: 'POST', body: { current: f.current.value, next: f.next.value } }); f.reset(); toast('Пароль змінено'); } catch (err) { toast(err.message, true); }
  });

  boot();
})();
</script>
</body>
</html>
