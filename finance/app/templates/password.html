{% extends "base.html" %}{% block title %}Пароль{% endblock %}{% block body %}
<div class="loginbox card" style="margin-top:6vh"><h1>{{ 'Створіть свій пароль' if user.must_change else 'Змінити пароль' }}</h1>
{% if user.must_change %}<p class="mut">Ви увійшли з тимчасовим паролем. Придумайте власний: його знатимете лише ви.</p>{% endif %}
<form method="post" action="/password"><label>{{ 'Тимчасовий пароль' if user.must_change else 'Поточний пароль' }}</label><input type="password" name="old" required autocomplete="current-password">
<label>Новий пароль (від 8 символів, відмінний від старого)</label><input type="password" name="new" required minlength="8" autocomplete="new-password"><p><button>Зберегти</button></p></form></div>{% endblock %}
